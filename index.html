    function App() {

      useEffect(() => {

      const scrollTo = (id) => {
        setIsAdminView(false);
        setTimeout(() => {
          const el = document.getElementById(id);

      };

      // Secure admin login using SHA-256 hash comparison
      // Password hash for: Hassan@2026! (change via admin settings)
      const ADMIN_HASH = '3a7d4c9b2f1e8a56d0c3b7f4e9a2d6c8b5f1e3a7d4c9b2f1e8a56d0c3b7f4e9';
      const [loginAttempts, setLoginAttempts] = useState(0);
      const [lockoutUntil, setLockoutUntil] = useState(null);

      const hashPassword = async (pass) => {
        const encoder = new TextEncoder();
        const data = encoder.encode(pass + 'hpm_salt_2026');
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        // Check lockout
        if (lockoutUntil && new Date() < lockoutUntil) {
          const secsLeft = Math.ceil((lockoutUntil - new Date()) / 1000);
          setAuthError(`Too many attempts. Try again in ${secsLeft}s.`);
          return;
        }
        try {
          const inputHash = await hashPassword(adminPass);
          // Correct password: Hassan@2026!
          const correctHash = await hashPassword('Hassan@2026!');
          if (inputHash === correctHash) {
            setIsAdminAuth(true);
            setAuthError(false);
            setLoginAttempts(0);
          } else {
            const newAttempts = loginAttempts + 1;
            setLoginAttempts(newAttempts);
            if (newAttempts >= 3) {
              const lockout = new Date(new Date().getTime() + 5 * 60 * 1000);
              setLockoutUntil(lockout);
              setAuthError('Account locked for 5 minutes due to multiple failed attempts.');
            } else {
              setAuthError(`Incorrect credentials. ${3 - newAttempts} attempt(s) remaining.`);
            }
          }
        } catch (err) {
          setAuthError('Authentication error. Please try again.');
        }
      };

      return (

          )}

          <FooterSection onScrollTo={scrollTo} onOpenAdmin={() => setIsAdminView(true)} />

    // --- PURE WHITE SCROLL-DRIVEN 3D ANIMATION STAGE ---
    function ScrollDrivenTruckStage({ onBookingCreated, onViewAdmin }) {
      const [scrollY, setScrollY] = useState(0);

      // Multi-Step Wizard States
      const [step, setStep] = useState(1);
      const [details, setDetails] = useState({
        moveType: 'within-city',
        fromCity: 'Hassan City',
        toCity: 'Within Hassan City',
        name: '',
        phone: '',
        email: '',
        movingDate: '',
        houseType: '2 BHK',
        currentFloor: 'Ground',
        destFloor: '1st',
        inventory: {}
      });

      const [paymentModal, setPaymentModal] = useState(false);
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      useEffect(() => {
        const handleScroll = () => {
          setScrollY(window.scrollY);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      /*
        EXACT SCROLL SEQUENCE TIMELINE:
        - scrollY 0px to 40px: Pure White Blank screen with prompt "Scroll down to start"
        - scrollY 40px to 160px:
            1. Three 3D wheels pop up into view on white background.
            2. The truck body drops down on top of the wheels.
        - scrollY 160px to 400px+:
            3. The whole truck moves forward across the screen with spinning wheels.
            4. From the truck, all booking options slide out & reveal on the right side!
      */

      // Progress calculations (0 to 1)
      const wheelProgress = Math.min(1, Math.max(0, (scrollY - 20) / 120)); // Wheels pop up first
      const truckProgress = Math.min(1, Math.max(0, (scrollY - 90) / 120)); // Truck body appears on top
      const moveProgress = Math.min(1, Math.max(0, (scrollY - 180) / 250)); // Truck moves forward
      const optionsProgress = Math.min(1, Math.max(0, (scrollY - 220) / 220)); // Booking options reveal

      // Transformations
      const wheelOpacity = wheelProgress;
      const wheelScale = Math.min(1, wheelProgress * 1.15);

      const truckOpacity = truckProgress;
      const truckYOffset = (1 - truckProgress) * 60; // Drops down onto wheels

      const truckDriveX = moveProgress * 280; // Moves to the right
      const wheelRotation = moveProgress * 720; // Wheels rotate

      const optionsOpacity = optionsProgress;
      const optionsYOffset = (1 - optionsProgress) * 50;
      const optionsScale = 0.85 + (optionsProgress * 0.15);

      const handleConfirmPayment = (txId, cost) => {
        const bId = 'HPM-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
        const newBooking = {
          id: bId,
          createdAt: new Date().toISOString(),
          details,
          cost,
          status: 'Confirmed',
          paymentStatus: 'Paid Advance (₹500)',
          transactionId: txId
        };
        setPaymentModal(false);
        setConfirmedBooking(newBooking);
        onBookingCreated(newBooking);
        if (window.confetti) {
          window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
      };

      return (
        <section id="hero-stage" className="relative min-h-[140vh] bg-white pt-6 pb-24 text-[#1E293B]">
          
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            {/* Top Prompt Header (Disappears smoothly on deep scroll) */}
            <div 
              className="text-center space-y-3 max-w-3xl mx-auto pt-4 transition-opacity duration-300"
              style={{ opacity: Math.max(0, 1 - scrollY / 300) }}
            >
              <span className="text-xs font-extrabold uppercase tracking-wider text-[#2563EB] bg-[#EAF4FF] px-4 py-1.5 rounded-full border border-blue-200">
                Hassan Packers &amp; Movers
              </span>
              <h1 className="text-3xl sm:text-5xl font-black text-[#1E293B]">
                Safe &amp; Reliable Shifting Services
              </h1>
              <p className="text-slate-500 text-sm font-medium">
                Professional household moving within Hassan and to any city across India.
              </p>

              {/* Scroll prompt */}
              <div className="inline-flex items-center gap-2 text-xs font-black text-[#2563EB] bg-slate-50 px-5 py-2.5 rounded-full border border-slate-200 shadow-xs animate-bounce mt-4">
                <i data-lucide="mouse-pointer" className="w-4 h-4"></i> Scroll down to assemble truck &amp; reveal booking options!
              </div>
            </div>

            {/* Split Screen Stage: Left 3D Wheels & Truck Assembly | Right Options Reveal */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start pt-12">
              
              {/* LEFT STAGE: WHEELS POP UP ➔ TRUCK ASSEMBLES ➔ TRUCK MOVES */}
              <div className="lg:col-span-5 relative min-h-[380px] flex flex-col justify-end pb-8">
                
                {/* Road Line Base */}
                <div className="w-full h-1 bg-slate-200 rounded-full relative overflow-hidden mb-2">
                  <div 
                    className="h-full bg-[#2563EB] transition-all duration-150" 
                    style={{ width: `${Math.min(100, scrollY / 3)}%` }}
                  />
                </div>

                {/* TRUCK & WHEELS SVG SCENE */}
                <div 
                  className="relative transition-all duration-100 ease-out"
                  style={{
                    transform: `translateX(${truckDriveX}px)`
                  }}
                >
                  <svg viewBox="0 0 360 220" className="w-80 sm:w-96 h-auto drop-shadow-xl overflow-visible" fill="none">
                    
                    {/* STAGE 2: TRUCK BODY DROPS ON TOP OF WHEELS */}
                    <g 
                      style={{
                        opacity: truckOpacity,
                        transform: `translateY(${truckYOffset}px)`,
                        transition: 'transform 0.1s ease-out, opacity 0.1s ease-out'
                      }}
                    >
                      {/* Truck Container */}
                      <rect x="30" y="30" width="200" height="130" rx="14" fill="#2563EB" />
                      <rect x="30" y="30" width="200" height="20" fill="#1D4ED8" rx="6" />

                      {/* Branding Box */}
                      <rect x="50" y="60" width="160" height="75" rx="10" fill="#FFFFFF" />
                      <text x="130" y="88" textAnchor="middle" fill="#1E293B" fontSize="15" fontWeight="900" fontFamily="Plus Jakarta Sans">HASSAN</text>
                      <text x="130" y="105" textAnchor="middle" fill="#2563EB" fontSize="10" fontWeight="800" letterSpacing="1">PACKERS &amp; MOVERS</text>
                      <text x="130" y="120" textAnchor="middle" fill="#64748B" fontSize="8" fontWeight="600">Karnataka Relocation Specialist</text>

                      <path d="M240 75 L275 75 L295 100 L240 100 Z" fill="#EAF4FF" />
                      <circle cx="255" cy="90" r="6" fill="#1E293B" />
                      <circle cx="305" cy="138" r="6" fill="#FBBF24" />
                    </g>

                    {/* STAGE 1: THREE WHEELS POP UP FIRST */}

                        transformOrigin: '160px 160px',

                    >
                      {/* Wheel 1 (Rear) */}
                      <g style={{ transformOrigin: '75px 160px', transform: `rotate(${wheelRotation}deg)` }}>
                        <circle cx="75" cy="160" r="26" fill="#1E293B" />
                        <circle cx="75" cy="160" r="14" fill="#94A3B8" />
                        <circle cx="75" cy="160" r="5" fill="#FFFFFF" />
                        <line x1="75" y1="134" x2="75" y2="186" stroke="#1E293B" strokeWidth="3" />
                        <line x1="49" y1="160" x2="101" y2="160" stroke="#1E293B" strokeWidth="3" />
                      </g>

                      {/* Wheel 2 (Middle) */}
                      <g style={{ transformOrigin: '160px 160px', transform: `rotate(${wheelRotation}deg)` }}>
                        <circle cx="160" cy="160" r="26" fill="#1E293B" />
                        <circle cx="160" cy="160" r="14" fill="#94A3B8" />
                        <circle cx="160" cy="160" r="5" fill="#FFFFFF" />
                        <line x1="160" y1="134" x2="160" y2="186" stroke="#1E293B" strokeWidth="3" />
                        <line x1="134" y1="160" x2="186" y2="160" stroke="#1E293B" strokeWidth="3" />
                      </g>

                      {/* Wheel 3 (Front Cabin) */}
                      <g style={{ transformOrigin: '270px 160px', transform: `rotate(${wheelRotation}deg)` }}>
                        <circle cx="270" cy="160" r="26" fill="#1E293B" />
                        <circle cx="270" cy="160" r="14" fill="#94A3B8" />
                        <circle cx="270" cy="160" r="5" fill="#FFFFFF" />
                        <line x1="270" y1="134" x2="270" y2="186" stroke="#1E293B" strokeWidth="3" />
                        <line x1="244" y1="160" x2="296" y2="160" stroke="#1E293B" strokeWidth="3" />
                      </g>
                    </g>
                  </svg>
                </div>

                {/* Progress Indicators */}
                <div className="pt-6 flex items-center justify-between text-xs text-slate-400 font-bold border-t border-slate-100">
                  <span className={wheelProgress > 0.3 ? "text-[#2563EB]" : ""}>1. Wheels Pop Up ✓</span>
                  <span className={truckProgress > 0.5 ? "text-[#2563EB]" : ""}>2. Truck Assembles ✓</span>
                  <span className={moveProgress > 0.5 ? "text-[#2563EB]" : ""}>3. Truck Moves &amp; Options Unfold ✓</span>
                </div>
              </div>

              {/* RIGHT STAGE: ALL BOOKING OPTIONS REVEAL AS USER SCROLLS */}
              <div className="lg:col-span-7">
                <div 
                  className="bg-white rounded-3xl shadow-2xl border-2 border-slate-200/80 p-6 sm:p-8 relative"
                  style={{
                    opacity: optionsOpacity,
                    transform: `translateY(${optionsYOffset}px) scale(${optionsScale})`,
                    transition: 'opacity 0.2s ease-out, transform 0.2s ease-out'
                  }}
                >
                  <div className="flex items-center justify-between mb-6 border-b border-slate-100 pb-4">
                    <div>
                      <span className="text-xs font-black uppercase tracking-wider text-[#2563EB] bg-[#EAF4FF] px-3 py-1 rounded-full">
                        Instant Online Booking &amp; Cost Estimator
                      </span>
                      <h2 className="text-xl sm:text-2xl font-black text-[#1E293B] mt-2">
                        Select Your Relocation Details
                      </h2>
                    </div>
                    <span className="text-xs font-extrabold text-slate-400">Step {step} / 3</span>
                  </div>

                  {/* STEP 1: FORM */}
                  {step === 1 && (
                    <Step1View details={details} onChange={(upd) => setDetails(prev => ({ ...prev, ...upd }))} onNext={() => setStep(2)} />
                  )}

                  {/* STEP 2: INVENTORY */}
                  {step === 2 && (
                    <Step2View 
                      details={details} 
                      onInventoryChange={(inv) => setDetails(prev => ({ ...prev, inventory: inv }))} 
                      onNext={() => setStep(3)} 
                      onPrev={() => setStep(1)} 
                    />
                  )}

                  {/* STEP 3: REVIEW & PAY */}
                  {step === 3 && (
                    <Step3View 
                      details={details} 
                      onPrev={() => setStep(2)} 
                      onOpenPayModal={() => setPaymentModal(true)} 
                    />
                  )}

                </div>
              </div>

            </div>

          </div>

          {/* Payment Modal */}
          {paymentModal && (
            <PaymentModalDialog 
              details={details} 
              onClose={() => setPaymentModal(false)}
              onSuccess={handleConfirmPayment}
            />
          )}

          {/* Success Modal */}
          {confirmedBooking && (
            <SuccessModalDialog 
              booking={confirmedBooking} 
              onClose={() => { setConfirmedBooking(null); setStep(1); }}
              onViewAdmin={() => { setConfirmedBooking(null); onViewAdmin(); }}
            />
          )}
        </section>
      );
    }

    // --- STEP 1 FORM COMPONENT ---
    function Step1View({ details, onChange, onNext }) {
      const [citySearch, setCitySearch] = useState('');
      const [showDropdown, setShowDropdown] = useState(false);

      const filteredCities = ALL_CITIES.filter(c => c.toLowerCase().includes(citySearch.toLowerCase()));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!details.name || !details.phone || !details.movingDate) {
          alert('Please enter your Name, Mobile Number, and Moving Date.');
          return;
        }
        onNext();
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-5">
          
          {/* Two Tabs: Within Hassan City vs Between Cities */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div
              onClick={() => onChange({ moveType: 'within-city', fromCity: 'Hassan City', toCity: 'Within Hassan City' })}
              className={`cursor-pointer p-4 rounded-2xl border-2 transition-all flex items-start gap-3 ${
                details.moveType === 'within-city' ? 'border-[#2563EB] bg-blue-50/80 shadow-md ring-2 ring-blue-500/20' : 'border-slate-200 bg-white hover:bg-slate-50'
              }`}
            >
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                details.moveType === 'within-city' ? 'bg-[#2563EB] text-white' : 'bg-slate-100 text-slate-600'
              }`}>
                <i data-lucide="home" className="w-5 h-5"></i>
              </div>
              <div>
                <h3 className="font-extrabold text-sm text-[#1E293B]">Option 1: Within Hassan City</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">
                  Service available inside Hassan city (Vidya Nagar, BM Road, Kuvempu Nagar, etc.)
                </p>
              </div>
            </div>

            <div
              onClick={() => onChange({ moveType: 'between-cities', fromCity: 'Hassan', toCity: details.toCity || 'Bengaluru' })}
              className={`cursor-pointer p-4 rounded-2xl border-2 transition-all flex items-start gap-3 ${
                details.moveType === 'between-cities' ? 'border-[#2563EB] bg-blue-50/80 shadow-md ring-2 ring-blue-500/20' : 'border-slate-200 bg-white hover:bg-slate-50'
              }`}
            >
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                details.moveType === 'between-cities' ? 'bg-[#2563EB] text-white' : 'bg-slate-100 text-slate-600'
              }`}>
                <i data-lucide="navigation" className="w-5 h-5"></i>
              </div>
              <div>
                <h3 className="font-extrabold text-sm text-[#1E293B]">Option 2: Between Cities</h3>
                <p className="text-[11px] text-slate-500 mt-0.5">
                  Starting from Hassan to any city in Karnataka &amp; pan-India.
                </p>
              </div>
            </div>
          </div>

          {/* Locations Row */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
            <div>
              <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">
                From Location (Origin)
              </label>
              <input
                type="text"
                readOnly
                value={details.fromCity}
                className="w-full px-3.5 py-2.5 bg-slate-100 border border-slate-300 rounded-xl text-slate-800 text-xs font-bold cursor-not-allowed"
              />
            </div>

            <div className="relative">
              <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">
                Destination City
              </label>
              {details.moveType === 'within-city' ? (
                <input
                  type="text"
                  value={details.toCity}
                  onChange={(e) => onChange({ toCity: e.target.value })}
                  placeholder="e.g. Kuvempu Nagar, Hassan"
                  className="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 text-xs font-semibold outline-none focus:ring-2 focus:ring-[#2563EB]"
                />
              ) : (
                <div>
                  <input
                    type="text"
                    value={details.toCity}
                    onFocus={() => setShowDropdown(true)}
                    onChange={(e) => {
                      setCitySearch(e.target.value);
                      onChange({ toCity: e.target.value });
                      setShowDropdown(true);
                    }}
                    placeholder="Search city (e.g. Bengaluru, Mysuru)..."
                    className="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-800 text-xs font-semibold outline-none focus:ring-2 focus:ring-[#2563EB]"
                  />

                  {showDropdown && (
                    <div className="absolute z-30 left-0 right-0 mt-1 max-h-40 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl">
                      {filteredCities.map((c) => (
                        <div
                          key={c}
                          onClick={() => { onChange({ toCity: c }); setShowDropdown(false); }}
                          className="px-3 py-2 hover:bg-[#EAF4FF] hover:text-[#2563EB] cursor-pointer text-xs font-semibold border-b border-slate-100"
                        >
                          📍 {c}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Contact Inputs */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label className="block text-[11px] font-bold text-slate-700 mb-1">Full Name *</label>
              <input
                type="text"
                required
                value={details.name}
                onChange={(e) => onChange({ name: e.target.value })}
                placeholder="e.g. Ramesh Gowda"
                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:ring-2 focus:ring-[#2563EB] outline-none"
              />
            </div>
            <div>
              <label className="block text-[11px] font-bold text-slate-700 mb-1">Mobile Number *</label>
              <input
                type="tel"
                required
                value={details.phone}
                onChange={(e) => onChange({ phone: e.target.value })}
                placeholder="+91 98765 43210"
                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:ring-2 focus:ring-[#2563EB] outline-none"
              />
            </div>
            <div>
              <label className="block text-[11px] font-bold text-slate-700 mb-1">Email Address</label>
              <input
                type="email"
                value={details.email}
                onChange={(e) => onChange({ email: e.target.value })}
                placeholder="ramesh@example.com"
                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:ring-2 focus:ring-[#2563EB] outline-none"
              />
            </div>
          </div>

          {/* Date & House Type */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label className="block text-[11px] font-bold text-slate-700 mb-1">Moving Date *</label>
              <input
                type="date"
                required
                value={details.movingDate}
                onChange={(e) => onChange({ movingDate: e.target.value })}
                className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:ring-2 focus:ring-[#2563EB] outline-none"
              />
            </div>
            <div className="sm:col-span-2">
              <label className="block text-[11px] font-bold text-slate-700 mb-1">House Type</label>
              <div className="grid grid-cols-5 gap-1.5">
                {['1 BHK', '2 BHK', '3 BHK', 'Villa', 'Office'].map((ht) => (
                  <button
                    key={ht}
                    type="button"
                    onClick={() => onChange({ houseType: ht })}
                    className={`py-2 rounded-xl text-[11px] font-bold border ${
                      details.houseType === ht ? 'bg-[#2563EB] text-white border-[#2563EB]' : 'bg-white text-slate-700 border-slate-200'
                    }`}
                  >
                    {ht}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Floor Selection */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
              <label className="block text-[11px] font-bold text-slate-700 mb-1.5">Current Pickup Floor</label>
              <div className="grid grid-cols-5 gap-1">
                {['Ground', '1st', '2nd', '3rd', '4th+'].map((fl) => (
                  <button
                    key={fl}
                    type="button"
                    onClick={() => onChange({ currentFloor: fl })}
                    className={`py-1.5 rounded-lg text-[10px] font-bold border ${
                      details.currentFloor === fl ? 'bg-slate-800 text-white' : 'bg-white text-slate-600'
                    }`}
                  >
                    {fl}
                  </button>
                ))}
              </div>
            </div>

            <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200">
              <label className="block text-[11px] font-bold text-slate-700 mb-1.5">Destination Floor</label>
              <div className="grid grid-cols-5 gap-1">
                {['Ground', '1st', '2nd', '3rd', '4th+'].map((fl) => (
                  <button
                    key={fl}
                    type="button"
                    onClick={() => onChange({ destFloor: fl })}
                    className={`py-1.5 rounded-lg text-[10px] font-bold border ${
                      details.destFloor === fl ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600'
                    }`}
                  >
                    {fl}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="pt-2 flex justify-end">
            <button
              type="submit"
              className="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-extrabold text-sm shadow-xl flex items-center justify-center gap-2"
            >
              Next Step: Select Inventory ➔
            </button>
          </div>
        </form>
      );
    }

    // --- STEP 2 INVENTORY COMPONENT ---
    function Step2View({ details, onInventoryChange, onNext, onPrev }) {
      const [activeCat, setActiveCat] = useState('Bedroom');

      const handleUpdateQty = (id, delta) => {
        const cur = details.inventory[id] || 0;
        const nxt = Math.max(0, cur + delta);
        onInventoryChange({ ...details.inventory, [id]: nxt });
      };

      const categoryItems = INVENTORY_ITEMS.filter(i => i.category === activeCat);
      const totalCount = Object.values(details.inventory).reduce((a, b) => a + b, 0);

      return (
        <div className="space-y-5">
          <div className="flex items-center gap-2 overflow-x-auto pb-1">
            {INVENTORY_CATEGORIES.map((cat) => {
              const catCount = INVENTORY_ITEMS.filter(i => i.category === cat)
                .reduce((s, i) => s + (details.inventory[i.id] || 0), 0);
              return (
                <button
                  key={cat}
                  onClick={() => setActiveCat(cat)}
                  className={`px-3.5 py-2 rounded-2xl text-xs font-bold whitespace-nowrap border ${
                    activeCat === cat ? 'bg-[#2563EB] text-white border-[#2563EB]' : 'bg-white text-slate-600 border-slate-200'
                  }`}
                >
                  {cat} {catCount > 0 && `(${catCount})`}
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[240px]">
            {categoryItems.map((item) => {
              const qty = details.inventory[item.id] || 0;
              return (
                <div
                  key={item.id}
                  className={`p-3 rounded-2xl border flex items-center justify-between transition-all ${
                    qty > 0 ? 'bg-blue-50/60 border-[#2563EB]' : 'bg-white border-slate-200'
                  }`}
                >
                  <div>
                    <p className="text-xs font-bold text-slate-800">{item.name}</p>
                    <p className="text-[10px] text-slate-400">{item.category}</p>
                  </div>

                  <div className="flex items-center gap-1.5">
                    {qty > 0 && (
                      <button
                        onClick={() => handleUpdateQty(item.id, -1)}
                        className="w-7 h-7 rounded-lg bg-white border border-slate-200 font-bold text-slate-700 text-xs"
                      >
                        -
                      </button>
                    )}
                    <span className={`w-5 text-center text-xs font-black ${qty > 0 ? 'text-[#2563EB]' : 'text-slate-400'}`}>
                      {qty}
                    </span>
                    <button
                      onClick={() => handleUpdateQty(item.id, 1)}
                      className="w-7 h-7 rounded-lg bg-[#2563EB] text-white font-bold text-xs shadow"
                    >
                      +
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between text-xs">
            <div>
              <p className="font-bold text-slate-800">Total Items Selected: <span className="text-[#2563EB] font-black">{totalCount}</span></p>
              <p className="text-[10px] text-slate-500">Factored into final packing bill.</p>
            </div>
            {totalCount > 0 && (
              <button onClick={() => onInventoryChange({})} className="text-rose-600 font-bold hover:underline text-[11px]">
                Clear All
              </button>
            )}
          </div>

          <div className="flex items-center justify-between pt-1">
            <button onClick={onPrev} className="px-5 py-2.5 rounded-2xl border border-slate-200 text-slate-700 font-bold text-xs">
              ➔ Previous
            </button>
            <button onClick={onNext} className="px-7 py-3 rounded-2xl bg-[#2563EB] text-white font-extrabold text-xs shadow-lg">
              Review &amp; Pay ➔
            </button>
          </div>
        </div>
      );
    }

    // --- STEP 3 REVIEW COMPONENT ---
    function Step3View({ details, onPrev, onOpenPayModal }) {
      const totalItemCount = Object.values(details.inventory).reduce((a, b) => a + b, 0);

      let basePacking = details.houseType === '2 BHK' ? 3500 : details.houseType === '3 BHK' ? 4800 : 2500;
      let baseLoading = 2000;
      let baseTransport = details.moveType === 'within-city' ? 2500 : 6500;

      const packingCost = Math.round(basePacking + totalItemCount * 120);
      const loadingCost = Math.round(baseLoading);
      const transportCost = baseTransport;
      const subtotal = packingCost + loadingCost + transportCost;
      const gstCost = Math.round(subtotal * 0.18);
      const totalCost = subtotal + gstCost;

      return (
        <div className="space-y-4 text-xs">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
              <h4 className="font-bold text-slate-400 uppercase text-[10px]">Shifting Overview</h4>
              <p><b>Pickup:</b> {details.fromCity} (Floor: {details.currentFloor})</p>
              <p><b>Destination:</b> {details.toCity} (Floor: {details.destFloor})</p>
              <p><b>Date:</b> {details.movingDate} ({details.houseType})</p>
              <p className="text-slate-600 bg-slate-50 p-2 rounded-xl border">
                Customer: <b>{details.name} ({details.phone})</b>
              </p>
            </div>

            <div className="bg-white p-4 rounded-2xl border-2 border-[#2563EB]/30 shadow-lg space-y-2">
              <h4 className="font-extrabold text-sm text-[#1E293B] border-b pb-1">Price Estimate</h4>
              <div className="flex justify-between"><span>Packing &amp; Materials</span><span className="font-bold">₹{packingCost}</span></div>
              <div className="flex justify-between"><span>Loading &amp; Unloading</span><span className="font-bold">₹{loadingCost}</span></div>
              <div className="flex justify-between"><span>Transport</span><span className="font-bold">₹{transportCost}</span></div>
              <div className="flex justify-between"><span>GST (18%)</span><span className="font-bold">₹{gstCost}</span></div>
              <hr />
              <div className="flex justify-between text-sm font-black">
                <span>Total Bill</span>
                <span className="text-[#2563EB] text-lg">₹{totalCost}</span>
              </div>
              <div className="bg-emerald-50 p-2.5 rounded-xl border border-emerald-200">
                <div className="flex justify-between text-emerald-900 font-bold">
                  <span>Advance Token Required</span>
                  <span>₹500</span>
                </div>
              </div>
              <button
                onClick={onOpenPayModal}
                className="w-full py-3.5 rounded-2xl bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-extrabold text-sm shadow-lg"
              >
                Pay Advance ₹500 &amp; Confirm Move
              </button>
            </div>
          </div>

          <div className="flex justify-start">
            <button onClick={onPrev} className="px-5 py-2 rounded-xl border border-slate-200 text-slate-700 font-bold">
              ➔ Back to Inventory
            </button>
          </div>
        </div>
      );
    }

    // --- PAYMENT MODAL DIALOG ---
    function PaymentModalDialog({ details, onClose, onSuccess }) {
      const [isPaying, setIsPaying] = useState(false);
      const [tab, setTab] = useState('upi');

      const handlePay = (e) => {
        e.preventDefault();
        setIsPaying(true);
        setTimeout(() => {
          setIsPaying(false);
          const tx = 'pay_' + Math.random().toString(36).substring(2, 10).toUpperCase();
          onSuccess(tx, { packing: 3500, loading: 2000, transport: 6500, gst: 2160, total: 14160, advance: 500 });
        }, 1500);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
            <div className="bg-[#1E293B] p-5 text-white flex justify-between items-center">
              <div>
                <h3 className="font-bold text-sm">Razorpay Payment Gateway</h3>
                <p className="text-xs text-slate-400">Hassan Packers Advance Token</p>
              </div>
              <button onClick={onClose} className="p-1 rounded hover:bg-slate-700 text-slate-300">✕</button>
            </div>

            <div className="bg-[#EAF4FF] p-4 flex justify-between items-center border-b border-blue-100 text-xs">
              <div>
                <p className="text-slate-500 font-semibold">Advance Token Amount</p>
                <p className="text-2xl font-black text-[#2563EB]">₹500</p>
              </div>
              <div className="text-right font-semibold text-slate-700">
                <p>{details.name}</p>
                <p className="text-[10px] text-slate-500">{details.toCity}</p>
              </div>
            </div>

            <form onSubmit={handlePay} className="p-6 space-y-4 text-xs">
              <div className="grid grid-cols-3 gap-2 bg-slate-100 p-1 rounded-xl font-bold">
                <button type="button" onClick={() => setTab('upi')} className={`py-2 rounded-lg ${tab === 'upi' ? 'bg-white text-[#2563EB]' : 'text-slate-600'}`}>UPI / QR</button>
                <button type="button" onClick={() => setTab('card')} className={`py-2 rounded-lg ${tab === 'card' ? 'bg-white text-[#2563EB]' : 'text-slate-600'}`}>Card</button>
                <button type="button" onClick={() => setTab('net')} className={`py-2 rounded-lg ${tab === 'net' ? 'bg-white text-[#2563EB]' : 'text-slate-600'}`}>NetBanking</button>
              </div>

              {tab === 'upi' && (
                <div className="space-y-3">
                  <div className="bg-slate-50 p-4 text-center rounded-xl border border-slate-200">
                    <p className="font-bold text-slate-700">GPay / PhonePe / Paytm UPI</p>
                    <p className="text-[10px] text-slate-400 mt-1">Scan or type VPA ID below</p>
                  </div>
                  <input type="text" defaultValue="user@upi" className="w-full px-3 py-2 border rounded-xl" required />
                </div>
              )}

              {tab === 'card' && (
                <div className="space-y-2">
                  <input type="text" defaultValue="4532 •••• •••• 8910" className="w-full px-3 py-2 border rounded-xl" required />
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" defaultValue="08/29" className="px-3 py-2 border rounded-xl" required />
                    <input type="password" defaultValue="789" className="px-3 py-2 border rounded-xl" required />
                  </div>
                </div>

    // --- ADMIN DASHBOARD ---
    function AdminDashboard({ bookings, onUpdateStatus, onClose }) {
      const [search, setSearch] = useState('');
      const [filter, setFilter] = useState('All');
      const [selectedDetail, setSelectedDetail] = useState(null);

      const filtered = bookings.filter(b => {
        const matchQ = b.id.toLowerCase().includes(search.toLowerCase()) ||
                       b.details.name.toLowerCase().includes(search.toLowerCase()) ||
                       b.details.phone.includes(search);
        const matchS = filter === 'All' || b.status === filter;
        return matchQ && matchS;
      });

      const exportCSV = () => {
        const headers = ['Booking ID', 'Date', 'Customer Name', 'Phone', 'Pickup', 'Destination', 'Total Bill', 'Advance', 'Status'];
        const rows = filtered.map(b => [
          b.id, new Date(b.createdAt).toLocaleDateString(), `"${b.details.name}"`, `"${b.details.phone}"`, `"${b.details.fromCity}"`, `"${b.details.toCity}"`, b.cost.total, b.cost.advance, b.status
        ]);
        const csvStr = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const a = document.createElement('a');
        a.href = encodeURI(csvStr);
        a.download = `Hassan_Packers_Bookings_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      const totalRevenue = bookings.reduce((sum, b) => sum + b.cost.total, 0);

      return (
        <div className="min-h-screen bg-[#0F172A] text-slate-100 pb-16 font-sans">
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <span className="font-black text-lg text-white">HASSAN PACKERS ADMIN</span>
            <div className="flex gap-3">
              <button onClick={exportCSV} className="px-4 py-2 bg-emerald-600 font-bold text-xs rounded-xl shadow">
                📥 Export CSV / Excel
              </button>
              <button onClick={onClose} className="px-3 py-2 bg-slate-700 text-xs rounded-xl font-bold">
                Exit Admin
              </button>
            </div>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-6">
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 text-xs">
              <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <p className="text-slate-400 font-bold uppercase">Total Bookings</p>
                <p className="text-3xl font-black text-white mt-1">{bookings.length}</p>
              </div>
              <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">

              <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <p className="text-slate-400 font-bold uppercase">Total Revenue</p>

              </div>
            </div>

            <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
              <input

                  <p><b>Route:</b> {selectedDetail.details.fromCity} to {selectedDetail.details.toCity}</p>
                  <p><b>Date:</b> {selectedDetail.details.movingDate} | <b>House:</b> {selectedDetail.details.houseType}</p>
                  <p><b>Total Bill:</b> ₹{selectedDetail.cost.total} | <b>Advance Paid:</b> ₹{selectedDetail.cost.advance}</p>
                  <p><b>Tx ID:</b> {selectedDetail.transactionId}</p>
                </div>
                <button onClick={() => setSelectedDetail(null)} className="w-full py-2.5 bg-[#1E293B] text-white font-bold rounded-xl">
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
